<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Vehicle Cards</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background-color: #f0f2f5;
      }
      .categories {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        margin-bottom: 20px;
        gap: 10px;
      }
      .categories button {
        padding: 10px 16px;
        border: none;
        background-color: #007bff;
        color: white;
        border-radius: 6px;
        cursor: pointer;
      }
      .cards-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 16px;
      }
      .card {
        background: white;
        border-radius: 10px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        transition: transform 0.2s ease;
        cursor: pointer;
      }
      .card:hover {
        transform: scale(1.03);
      }
      .card img {
        width: 100%;
        height: 160px;
        object-fit: cover;
      }
      .card-content {
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <h1 style="text-align: center">Vehicle Categories</h1>
    <div class="categories">
      <button onclick="fetchCards('Electric Bike')">Electric Bike</button>
      <button onclick="fetchCards('E-Cycles')">E-Cycles</button>
      <button onclick="fetchCards('High-Speed Scooter')">
        High-Speed Scooter
      </button>
      <button onclick="fetchCards('Low-Speed Scooter')">
        Low-Speed Scooter
      </button>
    </div>

    <div class="cards-container" id="cards-container"></div>

    <script>
      const baseURL = "https://vehical-cards-api.onrender.com";

      const categoryImages = {
        "Electric Bike": "https://picsum.photos/250/160?random=1",
        "E-Cycles": "https://picsum.photos/250/160?random=2",
        "High-Speed Scooter": "https://picsum.photos/250/160?random=3",
        "Low-Speed Scooter": "https://picsum.photos/250/160?random=4",
      };

      let currentCategory = "";

      async function fetchCards(category) {
        currentCategory = category;
        loadCards(category);
      }

      async function loadCards(category) {
        const response = await fetch(
          `${baseURL}/cards?category=${encodeURIComponent(category)}`
        );
        const cards = await response.json();
        const container = document.getElementById("cards-container");
        container.innerHTML = "";

        cards.forEach((card) => {
          const image =
            categoryImages[card.category] ||
            "https://via.placeholder.com/250x160";
          const div = document.createElement("div");
          div.className = "card";
          div.onclick = () => clickCard(card.id);
          div.innerHTML = `
            <img src="${image}" alt="${card.title}" />
            <div class="card-content">
              <h3>${card.title}</h3>
              <p>Clicks: ${card.click_count}</p>
            </div>
          `;
          container.appendChild(div);
        });
      }

      async function clickCard(cardId) {
        await fetch(`${baseURL}/cards/${cardId}/click`, {
          method: "POST",
        });
        loadCards(currentCategory);
      }
    </script>
  </body>
</html>
